<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耳鼻咽喉科・頭頸部外科 レジデントマニュアル</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Full-page layout ── */
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #1a2e5a 0%, #2d4a8a 60%, #2563ab 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ── Login card ── */
  .login-card {
    background: white;
    border-radius: 18px;
    padding: 2.75rem 2.25rem 2.25rem;
    width: 360px;
    max-width: 92vw;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    animation: card-in 0.45s cubic-bezier(.22,1,.36,1);
  }
  @keyframes card-in {
    from { transform: translateY(28px) scale(0.96); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .lock-icon {
    font-size: 2.6rem;
    margin-bottom: 1rem;
    display: block;
  }

  .login-card h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1a2e5a;
    line-height: 1.6;
    margin-bottom: 0.4rem;
  }

  .login-card .sub {
    font-size: 0.78rem;
    color: #6c757d;
    margin-bottom: 1.75rem;
  }

  /* ── Input row ── */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 0.6rem;
  }

  #pw-input {
    flex: 1;
    padding: 0.7rem 1rem;
    border: 2px solid #dee2e6;
    border-radius: 9px;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    color: #1a1a2e;
  }
  #pw-input:focus { border-color: #2563ab; }
  #pw-input.wrong {
    border-color: #e74c3c;
    animation: shake 0.35s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-7px); }
    40%      { transform: translateX(7px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }

  #submit-btn {
    padding: 0 1.2rem;
    background: #1a2e5a;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 1.2rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  #submit-btn:hover  { background: #2d4a8a; }
  #submit-btn:active { transform: scale(0.95); }

  /* ── Error message ── */
  #error-msg {
    font-size: 0.78rem;
    color: #e74c3c;
    min-height: 1.3em;
    margin-bottom: 0.75rem;
  }

  /* ── Divider ── */
  .divider {
    border: none;
    border-top: 1px solid #e9ecef;
    margin: 1rem 0;
  }

  .hint {
    font-size: 0.72rem;
    color: #adb5bd;
  }

  /* ── Iframe (hidden until auth) ── */
  #content-frame {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #f5f6f8;
  }
</style>
</head>
<body>

<!-- Password gate -->
<div class="login-card" id="login-card">
  <span class="lock-icon">🔒</span>
  <h1>耳鼻咽喉科・頭頸部外科<br>レジデントマニュアル</h1>
  <p class="sub">アクセスにはパスワードが必要です</p>

  <div class="input-row">
    <input
      id="pw-input"
      type="password"
      placeholder="パスワードを入力"
      autocomplete="current-password"
    />
    <button id="submit-btn" title="ログイン">→</button>
  </div>
  <p id="error-msg"></p>

  <hr class="divider">
  <p class="hint">関係者のみアクセス可能です</p>
</div>

<!-- Content frame (loaded after auth) -->
<iframe id="content-frame" title="コンテンツ"></iframe>

<script>
  const CORRECT     = '1919';
  const SESSION_KEY = 'ent_manual_auth';

  const loginCard   = document.getElementById('login-card');
  const pwInput     = document.getElementById('pw-input');
  const submitBtn   = document.getElementById('submit-btn');
  const errorMsg    = document.getElementById('error-msg');
  const frame       = document.getElementById('content-frame');

  /* Unlock: hide gate, show iframe */
  function unlock() {
    loginCard.style.transition = 'opacity 0.4s';
    loginCard.style.opacity = '0';
    setTimeout(() => {
      loginCard.style.display = 'none';
      document.body.style.background = '#f5f6f8';
      frame.src = 'content.html';
      frame.style.display = 'block';
    }, 400);
  }

  /* Already authenticated in this session? */
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    unlock();
  } else {
    pwInput.focus();
  }

  /* Verify password */
  function tryPassword() {
    if (pwInput.value.trim() === CORRECT) {
      sessionStorage.setItem(SESSION_KEY, '1');
      unlock();
    } else {
      pwInput.classList.remove('wrong');
      void pwInput.offsetWidth; // reflow to restart animation
      pwInput.classList.add('wrong');
      errorMsg.textContent = 'パスワードが違います。再度お試しください。';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  submitBtn.addEventListener('click', tryPassword);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryPassword(); });
</script>
</body>
</html>
